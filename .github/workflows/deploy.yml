# ─────────────────────────────────────────────────────────
# CI/CD 워크플로우 (자동 배포 활성화됨)
#
# develop에 push/머지되면 자동으로:
#   build → Docker Hub push → EC2 pull → 재시작 → migrate → collectstatic
# ─────────────────────────────────────────────────────────

name: Deploy to EC2

on:
  workflow_dispatch: # 수동 실행 (Actions 탭에서 버튼으로)

  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 push
        run: |
          docker build -t cjs1004ounds/dopamine-ledger:latest .
          docker push cjs1004ounds/dopamine-ledger:latest

      - name: EC2에 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/dopamine
            docker compose pull
            docker compose up -d
            docker compose exec -T web python manage.py migrate
            docker compose exec -T web python manage.py collectstatic --noinput
