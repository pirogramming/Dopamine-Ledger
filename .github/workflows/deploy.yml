# ─────────────────────────────────────────────────────────
# CI/CD 워크플로우 (기반 세팅 — 아직 자동 실행 안 됨)
#
# 현재 상태: 수동 실행(workflow_dispatch)만 가능.
#   → develop에 push해도 자동 배포되지 않음 (안전)
#   → GitHub → Actions 탭 → 이 워크플로우 선택 → "Run workflow" 버튼으로 수동 테스트
#
# 나중에 자동 배포를 켜려면:
#   아래 "on:" 블록에서 push 부분 주석(#)을 풀면 됨.
# ─────────────────────────────────────────────────────────

name: Deploy to EC2

on:
  workflow_dispatch: # 수동 실행 (Actions 탭에서 버튼으로)

  # ▼▼▼ 준비되면 아래 3줄 주석을 풀어서 자동 배포 활성화 ▼▼▼
  # push:
  #   branches:
  #     - develop
  # ▲▲▲ develop에 머지되면 자동 빌드→push→배포 ▲▲▲

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 push
        run: |
          docker build -t cjs1004ounds/dopamine-ledger:latest .
          docker push cjs1004ounds/dopamine-ledger:latest

      - name: EC2에 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/dopamine
            docker compose pull
            docker compose up -d
