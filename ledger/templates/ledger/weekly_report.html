{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주간 결산 - 도파민 가계부</title>
  <link rel="stylesheet" href="{% static 'ledger/weekly_report.css' %}">
</head>
<body>
  <div class="report-container">
    
    <!-- 1. 상단 타이틀 & 칭찬 요약 카드 -->
    <header class="report-header">
      <h1 class="page-title">이번 주 결산</h1>
      
      <div class="summary-card">
        <p id="praise-message" class="praise-text">로딩 중...</p>
        
        <div class="metrics-container">
          <div class="metric-item">
            <span class="metric-label">사용 시간</span>
            <span id="this-spend" class="metric-value">0시간 0분</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">적립 시간</span>
            <span id="this_earn" class="metric-value highlight">0시간 0분</span> 
            <!-- this_earn -> left-spend -->
          </div>
          <div class="metric-item">
            <span class="metric-label">전 주 대비 사용</span>
            <span id="spend-diff" class="metric-value diff-green">0분</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. 하단 활동 내역 섹션 -->
    <section class="history-section">
      <h2 class="section-title">활동 내역</h2>
      
      <!-- 날짜별 리스트가 JS를 통해 동적으로 삽입되는 컨테이너 -->
      <div id="history-list-container" class="history-list">
        <!-- JS Fetch 이전 스켈레톤/로딩 표시 -->
        <p class="loading-text">기록을 불러오는 중입니다...</p>
      </div>
    </section>

    <!-- 3. 하단 주간결산 공유 버튼 -->
    <div class="action-button-wrapper">
      <button type="button" class="btn-primary">주간결산 공유하기</button>
    </div>

    <!-- 4. 하단 고정 네비게이션 바 (아직 url 설정 안함) -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item"><img src="frame0.svg" alt="홈"><span class="nav-label">홈</span></a>
      <a href="#" class="nav-item"><img src="frame1.svg" alt="크루"><span class="nav-label">크루</span></a>
      <a href="#" class="nav-item"><img src="frame2.svg" alt="마감"><span class="nav-label">마감</span></a>
      <a href="#" class="nav-item active"><img src="frame3.svg" alt="결산"><span class="nav-label">결산</span></a>
      <a href="#" class="nav-item"><img src="frame4.svg" alt="설정"><span class="nav-label">설정</span></a>
    </nav>

  </div>

  <!-- 5. 백엔드 API 연동 JavaScript -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetchWeeklyReport();
    });

    function fetchWeeklyReport() {
      // 백엔드 API 호출 (Django Url Pattern)
      fetch("/ledger/api/weekly-report/")
        .then(response => {
          if (!response.ok) throw new Error("네트워크 응답 오류");
          return response.json();
        })
        .then(data => {
          // A. 칭찬 문구 세팅
          document.getElementById("praise-message").innerText = data.praise_message;

          // B. 수치 데이터 세팅 (시간/분 환산)
          document.getElementById("this-spend").innerText = formatHoursMins(data.this_spend_min);
          document.getElementById("this_earn").innerText = formatHoursMins(data.this_earn_min);
          // css에서 색 바꿔야 함 (그냥 검은색으로)
          
          // 전주 대비 숏폼 사용량 표현 (-면 줄임: 초록색 / +면 늘음: 주황색)
          const spendDiffEl = document.getElementById("spend-diff");
          const diffVal = data.spend_diff_min;
          if (diffVal <= 0) {
            spendDiffEl.innerText = `${diffVal}분`;
            spendDiffEl.className = "metric-value diff-green";
          } else {
            spendDiffEl.innerText = `+${diffVal}분`;
            spendDiffEl.className = "metric-value diff-orange";
          }

          // C. 활동 내역 세부 데이터가 있을 경우 동적 HTML 렌더링
          if (data.history_by_date) {
            renderHistoryList(data.history_by_date);
          }
        })
        .catch(err => {
          console.error("데이터 연동 실패:", err);
          document.getElementById("praise-message").innerText = "리포트 데이터를 불러오지 못했습니다.";
        });
    }

    // 분 단위 데이터를 X시간 Y분 문맥으로 변환하는 함수
    function formatHoursMins(totalMins) {
      const hrs = Math.floor(totalMins / 60);
      const mins = Math.round(totalMins % 60);
      if (hrs > 0) {
        return `${hrs}시간 ${mins}분`;
      }
      return `${mins}분`;
    }

    // 일자별 활동 내역 동적 HTML 생성 함수
    function renderHistoryList(historyData) {
      const container = document.getElementById("history-list-container");
      container.innerHTML = ""; // 기존 로딩 문구 제거

      historyData.forEach(dayGroup => {
        // 날짜 구분선 블록 생성
        const groupEl = document.createElement("div");
        groupEl.className = "day-group";

        let itemsHtml = "";
        dayGroup.items.forEach(item => {
          const isEarn = item.type === "earn";
          const amountClass = isEarn ? "amount-earn" : "amount-spend";
          const amountPrefix = isEarn ? "+" : "-";

          itemsHtml += `
            <div class="activity-card">
              <span class="activity-title">${item.title}</span>
              <span class="activity-time">${item.time}</span>
              <span class="activity-amount ${amountClass}">${amountPrefix}${item.amount}분</span>
            </div>
          `;
        });

        groupEl.innerHTML = `
          <div class="activity-cards-wrapper">${itemsHtml}</div>
          <div class="date-header">
            <span class="date-text">${dayGroup.date}</span>
            <div class="date-line"></div>
          </div>
        `;

        container.appendChild(groupEl);
      });
    }
  </script>
</body>
</html>
