{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'ledger/css/weekly_report.css' %}">
{% endblock %}


{% block content %}
<div class="report-container">
  <header class="report-header">
    <h1 class="page-title">이번 주 결산</h1>
        
    <div class="summary-card">
      <p id="praise-message" class="praise-text">로딩 중...</p>
          
      <div class="metrics-container">
        <div class="metric-item">
          <span class="metric-label">사용 시간</span>
          <span id="this-spend" class="metric-value">0시간 0분</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">수입 시간</span>
          <span id="this_earn" class="metric-value">0시간 0분</span> 
        </div>
        <div class="metric-item">
          <span class="metric-label">전 주 대비 사용</span>
          <span id="spend-diff" class="metric-value diff-green">0시간 0분</span>
        </div>
      </div>
    </div>
  </header>

  <section class="history-section">
    <h2 class="section-title">활동 내역</h2>
        
    <!-- 날짜별 리스트가 JS를 통해 동적으로 삽입되는 컨테이너 -->
    <div id="history-list-container" class="history-list">
      <!-- JS Fetch 이전 스켈레톤/로딩 표시 -->
      <p class="loading-text">기록을 불러오는 중입니다...</p>
    </div>
  </section>

  <!-- 3. 하단 주간결산 공유 버튼 -->
  <div class="action-button-wrapper">
    <button type="button" class="btn-primary" id="share-card-btn">주간결산 공유하기</button>
  </div>
</div>

<!-- 공유 모달: 버튼 클릭 시 열림 -->
<div id="share-modal" class="share-modal" hidden>
  <div class="share-modal__backdrop" data-close-modal></div>
  <div class="share-modal__panel" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
    <div class="share-modal__header">
      <h3 id="share-modal-title" class="share-modal__title">주간결산 공유하기</h3>
      <button type="button" class="share-modal__close" data-close-modal aria-label="닫기">&times;</button>
    </div>
    <div class="share-modal__body">
      <button type="button" class="share-option" data-action="download">
        <span class="share-option__icon">⬇️</span>
        <span class="share-option__label">
          <span class="share-option__title">이미지로 저장</span>
          <span class="share-option__desc">기기에 PNG로 다운로드</span>
        </span>
      </button>
      <button type="button" class="share-option" data-action="copy">
        <span class="share-option__icon">📋</span>
        <span class="share-option__label">
          <span class="share-option__title">이미지 복사</span>
          <span class="share-option__desc">카톡·슬랙 등에 붙여넣기</span>
        </span>
      </button>
      <button type="button" class="share-option" data-action="native" id="share-option-native" hidden>
        <span class="share-option__icon">📱</span>
        <span class="share-option__label">
          <span class="share-option__title">다른 앱으로 공유</span>
          <span class="share-option__desc">공유 시트 열기 (모바일 권장)</span>
        </span>
      </button>
    </div>
  </div>
</div>
{% endblock %}


{% block extra_js %}
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetchWeeklyReport();
      initShareButton();
    });

    // ============================================================
    // 결산 데이터 로드 & 렌더
    // ============================================================
    function fetchWeeklyReport() {
      fetch("/ledger/api/weekly-report/")
        .then(response => {
          if (!response.ok) throw new Error("네트워크 응답 오류");
          return response.json();
        })
        .then(data => {
          document.getElementById("praise-message").innerText = data.praise_message;
          document.getElementById("this-spend").innerText = formatHoursMins(data.this_spend_min);
          document.getElementById("this_earn").innerText = formatHoursMins(data.this_earn_min);

          const spendDiffEl = document.getElementById("spend-diff");
          const diffVal = data.spend_diff_min;
          if (diffVal <= 0) {
            spendDiffEl.innerText = `-${formatHoursMins(Math.abs(diffVal))}`;
            spendDiffEl.className = "metric-value diff-green";
          } else {
            spendDiffEl.innerText = `+${formatHoursMins(diffVal)}`;
            spendDiffEl.className = "metric-value diff-orange";
          }

          if (data.history_by_date) {
            renderHistoryList(data.history_by_date);
          }
        })
        .catch(err => {
          console.error("데이터 연동 실패:", err);
          document.getElementById("praise-message").innerText = "리포트 데이터를 불러오지 못했습니다.";
        });
    }

    function formatHoursMins(totalMins) {
      const hrs = Math.floor(totalMins / 60);
      const mins = Math.round(totalMins % 60);
      if (hrs > 0) {
        return `${hrs}시간 ${mins}분`;
      }
      return `${mins}분`;
    }

    function renderHistoryList(historyData) {
      const container = document.getElementById("history-list-container");
      container.innerHTML = "";

      historyData.forEach(dayGroup => {
        const groupEl = document.createElement("div");
        groupEl.className = "day-group";

        let itemsHtml = "";
        dayGroup.items.forEach(item => {
          const isEarn = item.type === "earn";
          const amountClass = isEarn ? "amount-earn" : "amount-spend";
          const amountPrefix = isEarn ? "+" : "-";

          itemsHtml += `
            <div class="activity-card">
              <span class="activity-title">${item.title}</span>
              <span class="activity-time">${item.time}</span>
              <span class="activity-amount ${amountClass}">${amountPrefix}${item.amount}</span>
            </div>
          `;
        });

        groupEl.innerHTML = `
          <div class="activity-cards-wrapper">${itemsHtml}</div>
          <div class="date-header">
            <span class="date-text">${dayGroup.date}</span>
            <div class="date-line"></div>
          </div>
        `;

        container.appendChild(groupEl);
      });
    }

    // ============================================================
    // 공유 모달 & 옵션들 (Pillow 서버 카드 사용)
    // ============================================================
    let cachedBlob = null;

    function initShareButton() {
      const btn = document.getElementById("share-card-btn");
      const modal = document.getElementById("share-modal");
      if (!btn || !modal) return;

      btn.addEventListener("click", () => openShareModal());

      modal.querySelectorAll("[data-close-modal]").forEach(el => {
        el.addEventListener("click", () => closeShareModal());
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.hidden) closeShareModal();
      });

      modal.querySelectorAll(".share-option").forEach(optBtn => {
        optBtn.addEventListener("click", async () => {
          await handleShareAction(optBtn.dataset.action);
        });
      });

      checkNativeShareAvailable();
    }

    function checkNativeShareAvailable() {
      try {
        const testFile = new File(["test"], "test.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [testFile] })) {
          document.getElementById("share-option-native").hidden = false;
        }
      } catch (e) {}
    }

    function openShareModal() {
      const modal = document.getElementById("share-modal");
      modal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeShareModal() {
      const modal = document.getElementById("share-modal");
      modal.hidden = true;
      document.body.style.overflow = "";
    }

    // Pillow 서버에서 카드 Blob 받아오기
    async function fetchCardBlob() {
      if (cachedBlob) return cachedBlob;

      const url = "{% url 'ledger:weekly_share_card' %}";
      const res = await fetch(url, { credentials: "same-origin" });
      if (!res.ok) throw new Error("카드 생성 실패 (" + res.status + ")");
      const blob = await res.blob();
      cachedBlob = blob;
      return blob;
    }

    async function handleShareAction(action) {
      try {
        showToast("카드 만드는 중...");
        const blob = await fetchCardBlob();
        hideToast();

        const today = new Date().toISOString().slice(0, 10);
        const filename = `dopamine-ledger-${today}.png`;

        if (action === "download") {
          downloadBlob(blob, filename);
          closeShareModal();
          showToast("이미지를 저장했어요!", 1500);
        }
        else if (action === "copy") {
          await copyImageToClipboard(blob);
          closeShareModal();
          showToast("클립보드에 복사됐어요. 원하는 곳에 붙여넣으세요!", 2000);
        }
        else if (action === "native") {
          const file = new File([blob], filename, { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: "이번 주 도파민 결산",
                text: "이번 주 내 도파민 가계부 결산이에요!",
              });
              closeShareModal();
            } catch (err) {
              if (err.name !== "AbortError") {
                console.warn("공유 실패, 다운로드로 폴백:", err);
                downloadBlob(blob, filename);
                closeShareModal();
              }
            }
          } else {
            downloadBlob(blob, filename);
            closeShareModal();
          }
        }
      } catch (err) {
        hideToast();
        console.error("공유 처리 실패:", err);
        alert("문제가 발생했어요. 다시 시도해주세요.");
      }
    }

    async function copyImageToClipboard(blob) {
      if (!navigator.clipboard || !window.ClipboardItem) {
        throw new Error("이 브라우저는 이미지 복사를 지원하지 않아요.");
      }
      const item = new ClipboardItem({ "image/png": blob });
      await navigator.clipboard.write([item]);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ============================================================
    // 토스트
    // ============================================================
    let toastEl = null;
    let toastTimer = null;

    function showToast(message, autoHideMs) {
      if (!toastEl) {
        toastEl = document.createElement("div");
        toastEl.className = "share-toast";
        document.body.appendChild(toastEl);
      }
      toastEl.textContent = message;
      requestAnimationFrame(() => toastEl.classList.add("share-toast--visible"));

      if (toastTimer) clearTimeout(toastTimer);
      if (autoHideMs) {
        toastTimer = setTimeout(hideToast, autoHideMs);
      }
    }

    function hideToast() {
      if (toastEl) toastEl.classList.remove("share-toast--visible");
      if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    }
  </script>
{% endblock %}
