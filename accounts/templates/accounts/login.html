{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
{% endblock %}

{% block content %}
<!-- page-wrapper > auth-card (공통) -->
<div class="auth-card">
    <h2 class="card-title">로그인</h2>

    <form id="loginForm" class="auth-form">
        <div class="input-group">
            <div class="input-box">
                <input type="email" id="email" class="input-field" placeholder="이메일" required>
            </div>
            <div class="input-box">
                <input type="password" id="password" class="input-field" placeholder="비밀번호 (8자 이상)" required>
            </div>
        </div>
    </form>

    <div class="button-group">
        <button type="button" class="btn-primary" onclick="handleLogin()">
            <span class="btn-primary__label">로그인</span>
        </button>
        <button type="button" class="btn-kakao" onclick="location.href='/accounts/kakao/login/'">
            <span class="btn-kakao__label">카카오로 로그인</span>
        </button>
        <p class="auth-footer">
            <span class="auth-footer__text">계정이 없나요? </span>
            <a href="/accounts/signup-page/" class="auth-footer__link">회원가입</a>
        </p>
    </div>
</div>

<!-- 공용 알림 모달 -->
<div class="modal-overlay" id="alert-modal">
    <div class="modal">
        <p id="alert-modal-msg"></p>
        <div class="modal-actions">
            <button type="button" class="modal-confirm-btn" onclick="closeAlertModal()">확인</button>
        </div>
    </div>
</div>
{% endblock %}

{% block nav %}{% endblock %}

{% block extra_js %}
<script>
    let modalRedirectUrl = null;   // 확인 누를 때 이동할 주소 (없으면 그냥 닫기)

    function showModal(message, redirectUrl) {
        document.getElementById('alert-modal-msg').textContent = message;
        document.getElementById('alert-modal').classList.add('open');
        modalRedirectUrl = redirectUrl || null;
    }
    function closeAlertModal() {
        document.getElementById('alert-modal').classList.remove('open');
        if (modalRedirectUrl) {
            window.location.href = modalRedirectUrl;
        }
    }
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showModal('이메일과 비밀번호를 모두 입력해 주세요.');
            return;
        }

        try {
            const response = await fetch('/accounts/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                const dest = data.is_onboarded ? '/ledger/' : '/accounts/onboarding-page/';
                showModal('환영합니다, ' + data.user.nickname + '님!', dest);
            } else {
                showModal('로그인 실패: ' + (data.email || data.password || data.account || '다시 확인해주세요'));
            }
        } catch (error) {
            console.error('Error:', error);
            showModal('서버 통신 중 에러가 발생했습니다.');
        }
    }
</script>
{% endblock %}
