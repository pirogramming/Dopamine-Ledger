{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/signup.css' %}">
{% endblock %}

{% block content %}
<div class="auth-card">
    <img src="{% static 'accounts/images/logo.png' %}" alt="도파민 가계부" class="logo">

    <form id="signupForm" class="auth-form">
        <div class="input-group">
            <div class="input-box">
                <input type="email" id="email" class="input-field" placeholder="이메일" required>
            </div>
            <div class="input-box">
                <input type="password" id="password" class="input-field" placeholder="비밀번호 (8자 이상)" required>
            </div>
            <div class="input-box">
                <input type="text" id="nickname" class="input-field" placeholder="닉네임" required>
            </div>
        </div>
    </form>

    <div class="button-group">
        <button type="button" class="btn-primary" onclick="handleSignup()">
            <span class="btn-primary__label">가입하기</span>
        </button>
        <button type="button" class="btn-kakao" onclick="location.href='/accounts/kakao/login/'">
            <span class="btn-kakao__label">카카오로 시작하기</span>
        </button>
        <p class="auth-footer">
            <span class="auth-footer__text">이미 계정이 있나요? </span>
            <a href="/accounts/login-page/" class="auth-footer__link">로그인</a>
        </p>
    </div>
</div>

<!-- 공용 알림 모달 -->
<div class="modal-overlay" id="alert-modal">
    <div class="modal">
        <p id="alert-modal-msg"></p>
        <div class="modal-actions">
            <button type="button" class="modal-confirm-btn" onclick="closeAlertModal()">확인</button>
        </div>
    </div>
</div>
{% endblock %}

{% block nav %}{% endblock %}

{% block extra_js%}
    

    <script>
        let modalRedirectUrl = null;

        function showModal(message, redirectUrl) {
            document.getElementById('alert-modal-msg').textContent = message;
            document.getElementById('alert-modal').classList.add('open');
            modalRedirectUrl = redirectUrl || null;
        }
        function closeAlertModal() {
            document.getElementById('alert-modal').classList.remove('open');
            if (modalRedirectUrl) {
                window.location.href = modalRedirectUrl;
            }
        }
        // 쿠키에서 CSRF 토큰 추출하는 함수
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function handleSignup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nickname = document.getElementById('nickname').value;

            if (!email || !password || !nickname) {
                showModal('모든 항목을 입력해 주세요.');
                return;
            }

            try {
                const response = await fetch('/accounts/signup/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        nickname: nickname
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showModal('회원가입이 완료되었습니다!', '/accounts/login-page/');
                } else {
                    const msg = data.email || data.password || data.nickname || '다시 확인해주세요';
                    showModal('회원가입 실패: ' + msg);
                }
            } catch (error) {
                console.error('Error:', error);
                showModal('서버 통신 중 에러가 발생했습니다.');
            }
        }
    </script>
{% endblock %}
