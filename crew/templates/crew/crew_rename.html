{% extends 'crew/base.html' %}

{% block title %}크루 이름 수정{% endblock %}

{% block content %}
    <h1>크루 이름 수정</h1>

    <p>현재 이름: <strong>{{ crew.name }}</strong></p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">저장</button>
    </form>

    <a href="{% url 'crew:detail' crew_id=crew.id %}">취소</a>
{% endblock %}
