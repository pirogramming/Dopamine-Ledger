<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크루 참여</title>
</head>
<body>
    <h1>크루 참여</h1>

    <p>아래 크루에 참여할까요?</p>
    <ul>
        <li>크루 이름: <strong>{{ crew.name }}</strong></li>
        <li>상태: {{ crew.get_status_display }}</li>
        <li>인원: {{ crew.member_count }}/{{ crew.MAX_MEMBERS }}</li>
    </ul>

    {% if already_member %}
        <p>이미 이 크루의 멤버예요.</p>
        <a href="{% url 'crew:detail' crew_id=crew.id %}">크루로 가기</a>
    {% else %}
        <form method="post">
            {% csrf_token %}
            <button type="submit">참여하기</button>
        </form>
        <a href="{% url 'crew:list' %}">취소</a>
    {% endif %}
</body>
</html>
