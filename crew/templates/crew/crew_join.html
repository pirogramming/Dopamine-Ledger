<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초대 코드로 참여</title>
</head>
<body>
    <h1>초대 코드로 참여</h1>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">참여하기</button>
    </form>

    <br>
    <a href="{% url 'crew:list' %}">← 내 크루 목록으로</a>
</body>
</html>
