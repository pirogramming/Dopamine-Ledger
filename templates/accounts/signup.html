<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 도파민 가계부</title>
</head>
<body>
    <h2>도파민 가계부 - 회원가입</h2>

    <form id="signupForm">
        <div>
            <label for="email">이메일</label><br>
            <input type="email" id="email" placeholder="이메일" required>
        </div>
        <br>
        <div>
            <label for="password">비밀번호</label><br>
            <input type="password" id="password" placeholder="비밀번호 (8자 이상)" required>
        </div>
        <br>
        <div>
            <label for="nickname">닉네임</label><br>
            <input type="text" id="nickname" placeholder="닉네임" required>
        </div>
        <br>
        <button type="button" onclick="handleSignup()">가입하기</button>
        
        <button type="button" onclick="location.href='/accounts/kakao/login/'">카카오로 시작하기</button>
    </form>

    <p>이미 계정이 있나요? <a href="/accounts/login/">로그인</a></p>

    <script>
        // 쿠키에서 CSRF 토큰 추출하는 함수
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function handleSignup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nickname = document.getElementById('nickname').value;

            if (!email || !password || !nickname) {
                alert(' 모든 항목을 입력해 주세요.');
                return;
            }

            try {
                const response = await fetch('/accounts/api/signup/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        nickname: nickname
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('회원가입이 완료되었습니다!');
                    
                    window.location.href = '/accounts/onboarding/'; 
                } else {
                    alert('회원가입 실패: ' + JSON.stringify(data));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 통신 중 에러가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
