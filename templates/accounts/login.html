<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 도파민 가계부</title>
</head>
<body>
    <h2>도파민 가계부 - 로그인</h2>

    <form id="loginForm">
        <div>
            <label for="email">이메일</label><br>
            <input type="email" id="email" placeholder="이메일" required>
        </div>
        <br>
        <div>
            <label for="password">비밀번호</label><br>
            <input type="password" id="password" placeholder="비밀번호 (8자 이상)" required>
        </div>
        <br>
        <button type="button" onclick="handleLogin()">로그인</button>
        
        <button type="button" onclick="location.href='/accounts/kakao/login/'">카카오로 로그인</button>
    </form>

    <p>계정이 없나요? <a href="/accounts/signup/">회원가입</a></p>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('이메일과 비밀번호를 모두 입력해 주세요.');
                return;
            }

            try {
                const response = await fetch('/accounts/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('로그인 성공! ' + data.user.nickname + '님 환영합니다.');
                    
                    window.location.href = '/ledger/';
                } else {
                    alert('로그인 실패: ' + JSON.stringify(data));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 통신 중 에러가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
